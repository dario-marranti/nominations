spring.application.name=abm-simulado
server.port=8080

# H2 en archivo (persiste entre reinicios). Para memoria: jdbc:h2:mem:abmdb
spring.datasource.url=jdbc:h2:file:./data/abmdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Errores en formato RFC 7807 (ProblemDetail)
spring.mvc.problemdetails.enabled=true

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Demora maxima simulada (segundos)
abm.simulado.max-delay-seconds=30
